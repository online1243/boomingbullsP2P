  <meta charset="UTF-8">

  <title>Redirecting to WhatsApp | Funded Squad</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-dark: #050608;
      --accent-gold: #e5b966;
      --accent-wa: #25D366;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at 50% 30%, rgba(37, 211, 102, 0.12) 0%, transparent 60%),
                        url('https://i.pinimg.com/736x/99/41/b8/9941b899952c879087e58fb355bccbc5.jpg');
      background-size: cover;
      background-position: center;
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .thankyou-card {
      background: rgba(14, 18, 26, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 28px;
      padding: 30px 20px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(37, 211, 102, 0.2);
      backdrop-filter: blur(20px);
    }

    .success-icon-ring {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(37, 211, 102, 0.15);
      border: 2px solid var(--accent-wa);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 2.2rem;
      color: var(--accent-wa);
      box-shadow: 0 0 20px rgba(37, 211, 102, 0.4);
      animation: pulseIcon 2s infinite;
    }

    @keyframes pulseIcon {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.6); }
      70% { transform: scale(1.05); box-shadow: 0 0 0 12px rgba(37, 211, 102, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 10px;
      color: #fff;
    }

    p {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .manual-wa-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
      color: #fff;
      padding: 14px 20px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      box-shadow: 0 8px 25px rgba(37, 211, 102, 0.4);
      transition: transform 0.2s;
    }

    .manual-wa-btn:active {
      transform: scale(0.96);
    }

    .loading-status {
      font-size: 0.76rem;
      color: #34d399;
      margin-top: 15px;
      font-weight: 600;
    }
  </style>

<body>

  <div class="thankyou-card">
    <div class="success-icon-ring">
      <i class="fa-brands fa-whatsapp"></i>
    </div>

    <h1>Connecting to WhatsApp...</h1>
    <p>Aapka request successfully record ho gaya hai. Hum aapko direct WhatsApp desk par redirect kar rahe hain.</p>

    <!-- Updated Backup Manual Button with context message -->
    <a href="https://wa.me/917357071060?text=Hello%20Funded%20Squad,%20saw%20your%20video%20ad.%20I%20want%20to%20safely%20exchange%20my%20prop%20payout%20into%20clean%20INR." id="waManualBtn" class="manual-wa-btn" target="_blank">
      <i class="fa-brands fa-whatsapp" style="font-size: 1.2rem;"></i>
      <span>Click here if WhatsApp doesn't open</span>
    </a>

    <div class="loading-status" id="statusText">
      <i class="fa-solid fa-circle-notch fa-spin"></i> Opening WhatsApp automatically...
    </div>
  </div>

  <script>
    var whatsappNumber = "917357071060";
    // Updated prefilled message matching business context
    var defaultMessage = "Hello Funded Squad, saw your video ad. I want to safely exchange my prop payout into clean INR.";
    var encodedMsg = encodeURIComponent(defaultMessage);
    var waUrl = "https://wa.me/" + whatsappNumber + "?text=" + encodedMsg;

    window.onload = function() {
      // Update backup link href dynamically
      document.getElementById('waManualBtn').href = waUrl;

      // 1. Background Trigger
      setTimeout(function() {
        var iframe = document.createElement('iframe');
        iframe.style.display = 'none';
        iframe.src = waUrl;
        document.body.appendChild(iframe);
      }, 400);

      // 2. Direct Window Redirect
      setTimeout(function() {
        document.getElementById('statusText').innerHTML = "Redirecting now...";
        window.location.href = waUrl;
      }, 1200);
    };
  </script>

</body>
